<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ad Reel Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
<main class="login-card">
  <div class="brand"><span class="logo" aria-hidden="true"></span><h1>Ad Reel Studio</h1></div>
  <p class="muted">Product photos in, Higgsfield videos out, for TikTok, Reels, Shorts, Pinterest and X.</p>
  <form id="f" autocomplete="on">
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required minlength="1">
    <button class="btn primary" type="submit">Open the studio</button>
    <p id="msg" class="msg" role="alert"></p>
  </form>
  <p id="setup" class="note" hidden></p>
</main>
<script src="/login.js"></script>
</body>
</html>
